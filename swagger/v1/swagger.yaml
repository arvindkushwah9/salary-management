---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/dashboard":
    get:
      summary: Get dashboard summary
      tags:
      - Dashboard
      responses:
        '200':
          description: dashboard summary returned
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      employees:
                        type: object
                        properties:
                          total:
                            type: integer
                          active:
                            type: integer
                          inactive:
                            type: integer
                        required:
                        - total
                        - active
                        - inactive
                      countries:
                        type: object
                        properties:
                          count:
                            type: integer
                          employee_count_by_country:
                            type: object
                            additionalProperties:
                              type: integer
                        required:
                        - count
                        - employee_count_by_country
                      salary:
                        type: object
                        properties:
                          employees_with_salary:
                            type: integer
                          currencies:
                            type: array
                            items:
                              type: string
                          statistics_by_currency:
                            type: array
                            items:
                              type: object
                              properties:
                                currency:
                                  type: string
                                minimum:
                                  type: number
                                maximum:
                                  type: number
                                average:
                                  type: number
                              required:
                              - currency
                              - minimum
                              - maximum
                              - average
                        required:
                        - employees_with_salary
                        - currencies
                        - statistics_by_currency
                    required:
                    - employees
                    - countries
                    - salary
                required:
                - data
  "/api/v1/employees":
    get:
      summary: List employees
      tags:
      - Employees
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: employment_status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: employees found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        employee_number:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        full_name:
                          type: string
                        email:
                          type: string
                        country:
                          type: string
                        department:
                          type: string
                          nullable: true
                        job_title:
                          type: string
                          nullable: true
                        employment_status:
                          type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
                required:
                - data
                - meta
    post:
      summary: Create employee
      tags:
      - Employees
      parameters: []
      responses:
        '201':
          description: employee created
        '422':
          description: invalid employee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - employee_number
              - first_name
              - last_name
              - email
              - country
              - employment_status
              properties:
                employee_number:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                country:
                  type: string
                department:
                  type: string
                job_title:
                  type: string
                employment_status:
                  type: string
        required: true
  "/api/v1/employees/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Show employee
      tags:
      - Employees
      responses:
        '200':
          description: employee found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      employee_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      full_name:
                        type: string
                      email:
                        type: string
                      country:
                        type: string
                      department:
                        type: string
                        nullable: true
                      job_title:
                        type: string
                        nullable: true
                      employment_status:
                        type: string
                required:
                - data
        '404':
          description: employee not found
    patch:
      summary: Update employee
      tags:
      - Employees
      parameters: []
      responses:
        '200':
          description: employee updated
        '422':
          description: invalid employee update
        '404':
          description: employee not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                country:
                  type: string
                department:
                  type: string
                job_title:
                  type: string
                employment_status:
                  type: string
        required: true
  "/api/v1/employees/{employee_id}/salary_records":
    parameters:
    - name: employee_id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: List salary records
      tags:
      - Salary Records
      responses:
        '200':
          description: salary records found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        employee_id:
                          type: string
                          format: uuid
                        amount:
                          type: number
                        currency:
                          type: string
                        effective_date:
                          type: string
                          format: date
                      required:
                      - id
                      - employee_id
                      - amount
                      - currency
                      - effective_date
                required:
                - data
        '404':
          description: employee not found
    post:
      summary: Create salary record
      tags:
      - Salary Records
      parameters: []
      responses:
        '201':
          description: salary record created
        '422':
          description: invalid salary record
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                effective_date:
                  type: string
                  format: date
        required: true
  "/api/v1/employees/{employee_id}/salary_records/{id}":
    parameters:
    - name: employee_id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Show salary record
      tags:
      - Salary Records
      responses:
        '200':
          description: salary record found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      employee_id:
                        type: string
                        format: uuid
                      amount:
                        type: number
                      currency:
                        type: string
                      effective_date:
                        type: string
                        format: date
                    required:
                    - id
                    - employee_id
                    - amount
                    - currency
                    - effective_date
                required:
                - data
        '404':
          description: salary record belongs to another employee
    patch:
      summary: Update salary record
      tags:
      - Salary Records
      parameters: []
      responses:
        '200':
          description: salary record updated
        '422':
          description: invalid salary record update
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount:
                  type: number
                  format: double
                  minimum: 0
                currency:
                  type: string
                  minLength: 3
                  maxLength: 3
                effective_date:
                  type: string
                  format: date
        required: true
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
