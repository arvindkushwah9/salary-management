---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/employees":
    get:
      summary: List employees
      tags:
      - Employees
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: employment_status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
      responses:
        '200':
          description: employees found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        employee_number:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        full_name:
                          type: string
                        email:
                          type: string
                          format: email
                        country:
                          type: string
                        department:
                          type: string
                          nullable: true
                        job_title:
                          type: string
                          nullable: true
                        employment_status:
                          type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
                required:
                - data
                - meta
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
