---
openapi: 3.0.1
info:
  title: API V1
  version: v1
paths:
  "/api/v1/employees":
    get:
      summary: List employees
      tags:
      - Employees
      parameters:
      - name: search
        in: query
        required: false
        schema:
          type: string
      - name: country
        in: query
        required: false
        schema:
          type: string
      - name: department
        in: query
        required: false
        schema:
          type: string
      - name: employment_status
        in: query
        required: false
        schema:
          type: string
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: employees found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        employee_number:
                          type: string
                        first_name:
                          type: string
                        last_name:
                          type: string
                        full_name:
                          type: string
                        email:
                          type: string
                        country:
                          type: string
                        department:
                          type: string
                          nullable: true
                        job_title:
                          type: string
                          nullable: true
                        employment_status:
                          type: string
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      pages:
                        type: integer
                required:
                - data
                - meta
    post:
      summary: Create employee
      tags:
      - Employees
      parameters: []
      responses:
        '201':
          description: employee created
        '422':
          description: invalid employee
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - employee_number
              - first_name
              - last_name
              - email
              - country
              - employment_status
              properties:
                employee_number:
                  type: string
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                country:
                  type: string
                department:
                  type: string
                job_title:
                  type: string
                employment_status:
                  type: string
        required: true
  "/api/v1/employees/{id}":
    parameters:
    - name: id
      in: path
      format: uuid
      required: true
      schema:
        type: string
    get:
      summary: Show employee
      tags:
      - Employees
      responses:
        '200':
          description: employee found
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                      employee_number:
                        type: string
                      first_name:
                        type: string
                      last_name:
                        type: string
                      full_name:
                        type: string
                      email:
                        type: string
                      country:
                        type: string
                      department:
                        type: string
                        nullable: true
                      job_title:
                        type: string
                        nullable: true
                      employment_status:
                        type: string
                required:
                - data
        '404':
          description: employee not found
    patch:
      summary: Update employee
      tags:
      - Employees
      parameters: []
      responses:
        '200':
          description: employee updated
        '422':
          description: invalid employee update
        '404':
          description: employee not found
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                first_name:
                  type: string
                last_name:
                  type: string
                email:
                  type: string
                country:
                  type: string
                department:
                  type: string
                job_title:
                  type: string
                employment_status:
                  type: string
        required: true
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3000
